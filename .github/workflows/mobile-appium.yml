name: Mobile appium e2e tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  mobile-appium-tests:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Node.js (for Appium)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Install Appium and UIAutomator2 Driver
      - name: Install Appium & UIAutomator2
        run: |
          sudo mkdir -p /usr/local/lib/node_modules
          sudo chown -R $USER /usr/local/lib/node_modules
          sudo chown -R $USER /usr/local/bin
          npm install -g appium
          appium driver install uiautomator2

      # 5. Set up Python (for pytest)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: e2e_tests/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r e2e_tests/requirements.txt

      # 6. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.6'

      # 7. Build Android APK
      - name: Build Android Debug APK
        run: flutter build apk --debug

      # 8. Start Android Emulator and Run E2E Tests
      - name: Run Appium Tests in Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: |
            # Start Appium server in background
            appium --port 4723 --log-level error &
            
            # Wait for Emulator to be ready and Appium to start
            sleep 15
            
            # Install the APK built in step 7
            adb install build/app/outputs/flutter-apk/app-debug.apk
            
            # Run the mobile Appium E2E pytest suite
            python e2e_tests/mobile_appium/run_appium_tests.py

      # 9. Upload Test Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mospl-mobile-appium-reports-run-${{ github.run_number }}
          path: |
            e2e_tests/reports/*.xlsx
            e2e_tests/reports/*.html
            e2e_tests/reports/*.xml
          retention-days: 30
          if-no-files-found: warn
